name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npx eslint src e2e

      - name: Tipos
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Build
        run: npm run build

      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de navegador (e2e)
        run: npm run e2e

      - name: Relatório do Playwright (só quando falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: test-results/
          retention-days: 7
